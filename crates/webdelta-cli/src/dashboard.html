<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webdelta Dashboard</title>
  <style>
    :root {
      --bg: #0f141b;
      --panel: #161d26;
      --border: #263140;
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --code-bg: #0b0f14;
    }
    [data-theme="light"] {
      --bg: #f6f8fa;
      --panel: #ffffff;
      --border: #d0d7de;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --green: #1a7f37;
      --amber: #9a6700;
      --red: #cf222e;
      --code-bg: #f0f3f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type="search"], input[type="password"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 13px;
      min-width: 220px;
    }
    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    button.primary:hover { background: var(--accent-hover); }
    main { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .badge.ok { color: var(--green); border-color: var(--green); }
    .badge.warn { color: var(--amber); border-color: var(--amber); }
    .badge.err { color: var(--red); border-color: var(--red); }
    .muted { color: var(--muted); font-size: 12px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .banner {
      background: var(--panel);
      border: 1px solid var(--amber);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .banner.show { display: flex; }
    dialog {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-width: 820px;
      width: 92%;
      padding: 0;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
    .modal-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { padding: 18px; max-height: 75vh; overflow-y: auto; }
    pre.diff {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.45;
    }
    .diff-add { color: var(--green); }
    .diff-del { color: var(--red); }
    .sparkline {
      width: 100%;
      height: 110px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .export-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="brand">webdelta <span>Local Monitor Dashboard</span></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Filter by id, name, or URL...">
      <button id="check-all" class="primary">Check All</button>
      <button id="refresh-btn">Refresh</button>
      <button id="theme-btn">Theme</button>
    </div>
  </header>

  <main>
    <div id="auth-banner" class="banner">
      <span>API authentication required. Enter bearer token:</span>
      <div class="controls">
        <input id="token-input" type="password" placeholder="Bearer token">
        <button id="token-save" class="primary">Save Token</button>
      </div>
    </div>

    <div id="msg-banner" class="banner">
      <span id="msg-text"></span>
      <button onclick="document.getElementById('msg-banner').classList.remove('show')">Dismiss</button>
    </div>

    <section class="stats">
      <div class="stat-card"><div class="stat-label">Total Watches</div><div id="stat-total" class="stat-value">0</div></div>
      <div class="stat-card"><div class="stat-label">Enabled</div><div id="stat-enabled" class="stat-value">0</div></div>
      <div class="stat-card"><div class="stat-label">Checked</div><div id="stat-checked" class="stat-value">0</div></div>
      <div class="stat-card"><div class="stat-label">With Numeric Value</div><div id="stat-numeric" class="stat-value">0</div></div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Watch</th>
            <th>Engine / Interval</th>
            <th>State</th>
            <th>Last Check</th>
            <th>Latest Value</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="watches-body"></tbody>
      </table>
    </section>
  </main>

  <dialog id="detail-modal">
    <div class="modal-head">
      <strong id="modal-title">Details</strong>
      <button onclick="document.getElementById('detail-modal').close()">Close</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <script>
    let watchesCache = [];

    function getToken() {
      return sessionStorage.getItem("webdelta_token") || "";
    }

    async function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      const tok = getToken();
      if (tok) headers.set("Authorization", "Bearer " + tok);
      const resp = await fetch(url, { ...options, headers });
      if (resp.status === 401) {
        document.getElementById("auth-banner").classList.add("show");
        throw new Error("Unauthorized: enter bearer token");
      }
      document.getElementById("auth-banner").classList.remove("show");
      return resp;
    }

    function showNotice(text) {
      document.getElementById("msg-text").textContent = text;
      document.getElementById("msg-banner").classList.add("show");
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadWatches() {
      try {
        const resp = await apiFetch("/api/watches");
        const data = await resp.json();
        watchesCache = data.watches || [];
        renderTable();
      } catch (err) {
        showNotice(err.message);
      }
    }

    function renderTable() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const filtered = watchesCache.filter(w =>
        !q || w.id.toLowerCase().includes(q) || w.name.toLowerCase().includes(q) || w.url.toLowerCase().includes(q)
      );

      document.getElementById("stat-total").textContent = watchesCache.length;
      document.getElementById("stat-enabled").textContent = watchesCache.filter(w => w.enabled).length;
      document.getElementById("stat-checked").textContent = watchesCache.filter(w => w.latest).length;
      document.getElementById("stat-numeric").textContent = watchesCache.filter(w => w.latest && w.latest.numeric_value != null).length;

      const tbody = document.getElementById("watches-body");
      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="muted">No matching watches configured.</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(w => {
        const snap = w.latest;
        const stateBadge = w.enabled
          ? '<span class="badge ok">enabled</span>'
          : '<span class="badge warn">paused</span>';
        const lastCheck = snap ? new Date(snap.checked_at).toLocaleString() : "never";
        const statusCode = snap ? `HTTP ${snap.status_code}` : "unseen";
        const valText = snap ? esc(snap.extracted_text.slice(0, 72)) : "(no snapshot)";
        const numText = snap && snap.numeric_value != null ? `<div class="muted">Numeric: ${snap.numeric_value}</div>` : "";
        return `
          <tr>
            <td>
              <div><strong>${esc(w.name)}</strong> <span class="mono muted">(${esc(w.id)})</span></div>
              <div class="muted mono">${esc(w.url)}</div>
            </td>
            <td><span class="mono">${esc(w.engine)} / ${esc(w.interval)}</span></td>
            <td>${stateBadge}</td>
            <td><div>${esc(lastCheck)}</div><div class="muted">${esc(statusCode)}</div></td>
            <td><div class="mono">${valText}</div>${numText}</td>
            <td>
              <div class="actions">
                <button onclick="checkOne('${esc(w.id)}')">Check</button>
                <button onclick="openDiff('${esc(w.id)}')">Diff</button>
                <button onclick="openHistory('${esc(w.id)}')">History</button>
                <button onclick="toggleWatch('${esc(w.id)}')">${w.enabled ? "Pause" : "Resume"}</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    async function checkOne(id) {
      try {
        const resp = await apiFetch(`/api/watches/${encodeURIComponent(id)}/check`, { method: "POST" });
        const data = await resp.json();
        showNotice(`Checked '${id}': ${data.status} (HTTP ${data.status_code ?? "n/a"}, ${data.elapsed_ms} ms)`);
        await loadWatches();
      } catch (err) {
        showNotice(err.message);
      }
    }

    async function checkAll() {
      const btn = document.getElementById("check-all");
      btn.disabled = true;
      try {
        const resp = await apiFetch("/api/check", { method: "POST" });
        const data = await resp.json();
        showNotice(`Checked ${data.count} watch(es): ${data.changed} changed, ${data.errors} error(s).`);
        await loadWatches();
      } catch (err) {
        showNotice(err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleWatch(id) {
      try {
        const resp = await apiFetch(`/api/watches/${encodeURIComponent(id)}/toggle`, { method: "POST" });
        const data = await resp.json();
        showNotice(`Watch '${id}' is now ${data.enabled ? "enabled" : "paused"}.`);
        await loadWatches();
      } catch (err) {
        showNotice(err.message);
      }
    }

    async function openDiff(id) {
      try {
        const resp = await apiFetch(`/api/watches/${encodeURIComponent(id)}/diff`);
        const data = await resp.json();
        const modal = document.getElementById("detail-modal");
        document.getElementById("modal-title").textContent = `Latest Diff: ${id}`;
        const body = document.getElementById("modal-body");

        if (!data.diff) {
          body.innerHTML = `<p class="muted">${esc(data.message || "Fewer than two snapshots recorded.")}</p>`;
        } else {
          const delta = data.numeric_delta
            ? `<p>Numeric delta: <strong>${data.numeric_delta.diff >= 0 ? "+" : ""}${data.numeric_delta.diff.toFixed(2)}</strong>` +
              (data.numeric_delta.percent_change != null ? ` (${data.numeric_delta.percent_change.toFixed(2)}%)` : "") + "</p>"
            : "";
          const lines = (data.diff.unified || "No line changes.").split("\n").map(line => {
            if (line.startsWith("+") && !line.startsWith("+++")) return `<div class="diff-add">${esc(line)}</div>`;
            if (line.startsWith("-") && !line.startsWith("---")) return `<div class="diff-del">${esc(line)}</div>`;
            return `<div>${esc(line)}</div>`;
          }).join("");
          body.innerHTML = `${delta}<p class="muted">${esc(data.diff.summary)}</p><pre class="diff">${lines}</pre>`;
        }
        modal.showModal();
      } catch (err) {
        showNotice(err.message);
      }
    }

    function renderSparkline(snapshots) {
      const nums = snapshots
        .slice()
        .reverse()
        .map(s => s.numeric_value)
        .filter(v => typeof v === "number" && Number.isFinite(v));
      if (nums.length < 2) return "";
      const min = Math.min(...nums);
      const max = Math.max(...nums);
      const span = max - min || 1;
      const w = 720, h = 100, pad = 12;
      const pts = nums.map((v, idx) => {
        const x = pad + (idx / (nums.length - 1)) * (w - pad * 2);
        const y = h - pad - ((v - min) / span) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts}" />
      </svg><div class="muted" style="margin-bottom:10px;">Numeric range: ${min} to ${max} (${nums.length} points)</div>`;
    }

    async function downloadExport(id, fmt) {
      try {
        const resp = await apiFetch(`/api/watches/${encodeURIComponent(id)}/export?format=${fmt}&limit=100`);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${id}.${fmt === "rss" ? "xml" : fmt}`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        showNotice(err.message);
      }
    }

    async function openHistory(id) {
      try {
        const resp = await apiFetch(`/api/watches/${encodeURIComponent(id)}/history?limit=30`);
        const data = await resp.json();
        const modal = document.getElementById("detail-modal");
        document.getElementById("modal-title").textContent = `History: ${id}`;
        const body = document.getElementById("modal-body");

        const exportsHtml = `<div class="export-row">
          <button onclick="downloadExport('${esc(id)}', 'json')">Export JSON</button>
          <button onclick="downloadExport('${esc(id)}', 'csv')">Export CSV</button>
          <button onclick="downloadExport('${esc(id)}', 'rss')">Export RSS</button>
        </div>`;

        const snaps = data.snapshots || [];
        if (snaps.length === 0) {
          body.innerHTML = exportsHtml + '<p class="muted">No snapshots recorded yet.</p>';
        } else {
          const chart = renderSparkline(snaps);
          const rows = snaps.map(s => `
            <tr>
              <td class="mono">${esc(new Date(s.checked_at).toLocaleString())}</td>
              <td>HTTP ${s.status_code}</td>
              <td>${s.elapsed_ms} ms</td>
              <td>${s.numeric_value != null ? s.numeric_value : "-"}</td>
              <td class="mono">${esc(s.extracted_text.slice(0, 64))}</td>
            </tr>
          `).join("");
          body.innerHTML = exportsHtml + chart + `<table><thead><tr><th>Checked At</th><th>HTTP</th><th>Elapsed</th><th>Numeric</th><th>Value</th></tr></thead><tbody>${rows}</tbody></table>`;
        }
        modal.showModal();
      } catch (err) {
        showNotice(err.message);
      }
    }

    document.getElementById("search").addEventListener("input", renderTable);
    document.getElementById("check-all").addEventListener("click", checkAll);
    document.getElementById("refresh-btn").addEventListener("click", loadWatches);
    document.getElementById("theme-btn").addEventListener("click", () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === "light" ? "" : "light";
    });
    document.getElementById("token-save").addEventListener("click", () => {
      sessionStorage.setItem("webdelta_token", document.getElementById("token-input").value.trim());
      loadWatches();
    });

    loadWatches();
  </script>
</body>
</html>
