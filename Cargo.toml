[workspace]
resolver = "2"
members = [
    "crates/webdelta-core",
    "crates/webdelta-browser",
    "crates/webdelta-mcp",
    "crates/webdelta-cli",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/luminariadev/webdelta"
keywords = ["automation", "monitoring", "diff", "webhook", "mcp"]
categories = ["command-line-utilities", "web-programming"]

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "io-std", "io-util", "net", "sync", "process"] }
axum = "0.8"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
redb = "2"
scraper = "0.22"
serde_json_path = "0.7"
similar = "2"
regex = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tempfile = "3"
assert_cmd = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
