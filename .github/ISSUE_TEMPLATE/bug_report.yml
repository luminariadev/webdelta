name: Bug Report
description: Report a bug or unexpected behavior in webdelta
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Description
      description: Clear summary of what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction Steps
      description: Commands run, minimal webdelta.toml snippet (redact any secrets), and sample output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "webdelta 0.1.0 on Linux x86_64 / Windows 11 / macOS"
    validations:
      required: true
