name: Feature Request
description: Propose a new extractor, notifier, CLI command, or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the monitoring or automation workflow you want to support.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the CLI flags, configuration fields, or MCP behavior you have in mind.
    validations:
      required: true
